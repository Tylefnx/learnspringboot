version: '3.8'

services:
  # 1. Frontend Web App (Nginx + React)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: springboot-hub-web
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - springboot-network

  # 2. Backend Spring Boot 3.3 Reference App (Java 21)
  api:
    build:
      context: ./springboot-reference-app
      dockerfile: Dockerfile
    container_name: springboot-hub-api
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/masterydb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - springboot-network

  # 3. PostgreSQL 16 Database
  db:
    image: postgres:16-alpine
    container_name: springboot-hub-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=masterydb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d masterydb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - springboot-network

networks:
  springboot-network:
    driver: bridge

volumes:
  pgdata:
